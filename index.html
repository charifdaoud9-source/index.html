<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عبد الشافي عمك</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0f172a; /* خلفية داكنة لإبراز اللون الذهبي */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .gold-text {
            font-size: 4rem;
            font-weight: bold;
            /* تأثير اللون الذهبي المتدرج */
            background: linear-gradient(135deg, #FFE57F 0%, #FFD700 25%, #D4AF37 50%, #B8860B 75%, #FFE57F 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* ظل نص إضافي لإعطاء لمعان */
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            text-align: center;
            padding: 10px;
        }

        /* استجابة لشاشات الهواتف */
        @media (max-width: 600px) {
            .gold-text {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>

    <h1 class="gold-text">عبد الشافي عمك</h1>

</body>
</html>
